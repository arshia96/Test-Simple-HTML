<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input {
            display: block;
        }
    </style>
</head>
<body>
    <h3>register</h3>
    <form action="#!" id="reg">
        <label for="user">username</label>
        <input type="text" id="user">
        <label for="pass">password</label>
        <input type="password" id="pass">
        <input type="submit" value="Submit">
    </form>

    <h3>login</h3>
    <form action="#!" id="login">
        <label for="user">username</label>
        <input type="text" id="username">
        <label for="pass">password</label>
        <input type="password" id="password">
        <input type="submit" value="Submit">
    </form>


    <script>
        class User { // a = User("a", "p") ; a.welcome(); a.username; User.welcome()
            constructor(username, password) {
                this.username = username;
                this.password = password;
            }
            welcome() {
                document.write(`Hello ${this.username} !`);
            }
        }

        document.querySelector("#reg").addEventListener("submit", async(e) => {
            e.preventDefault();
            var username = document.querySelector("#user").value;
            var pass = document.querySelector("#pass").value;
            var user = new User(username, pass);
            // user.welcome();
            //var user1 = new User("Taha", "1234");
            //user1.welcome();
            //document.write(typeof(user))
            // document.write(JSON.stringify(user));
            try {
                var users = await getUsers();
                users.push(user);
            }
            catch(error) {
                var users = [];
                users.push(user);
            }

            // JSON Files
            const json = JSON.stringify(users);

            const blob = new Blob([json], {
                type: "application/json"
            });

            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "users.json";
            link.click();
            URL.revokeObjectURL(link.href);
        });

        // LOGIN
        document.querySelector("#login").addEventListener("submit", async (e) => {
            e.preventDefault();
            var username = document.querySelector("#username").value;
            var pass = document.querySelector("#password").value;
            var users = await getUsers();
            console.log(users);
            if(users.find(u => u.username === username && u.password === pass)) {
                var user = new User(username, pass);
                user.welcome();
            }
        });
        
        async function getUsers() {
            const result = await fetch("./users.json");
            const data = await result.json();
            return data;
        }
    </script>
</body>
</html>
